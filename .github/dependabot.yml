# Keeps the SHA-pinned actions in .github/workflows/ up to date. Dependabot
# understands `uses: owner/action@<sha> # vX.Y.Z` pins and bumps both the SHA
# and the version comment in one PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Terraform provider + lock-file updates. Dependabot does not recurse, so one
  # entry per stack directory is required.
  - package-ecosystem: terraform
    directory: /bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /shared
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /projects/radomskyi-com
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /projects/stagehopper
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /projects/spacetraders
    schedule:
      interval: weekly
