name: terraform apply

# Manual only. After a PR is reviewed and merged into main, trigger this from the
# Actions tab (or `gh workflow run apply.yml -f stack=projects/stagehopper`) to apply
# that stack. Nothing applies automatically on merge — a human always presses go.
#
# bootstrap is intentionally absent: it manages the OIDC provider and these very CI
# roles, so it stays applied from a workstation to avoid a run that breaks its own trust.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to apply
        required: true
        type: choice
        options:
          - shared
          - projects/radomskyi-com
          - projects/stagehopper
          - projects/spacetraders

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  # Trust is restricted to refs/heads/main, so this assume only succeeds when the
  # workflow is dispatched against main (the default), not a feature branch.
  APPLY_ROLE_ARN: arn:aws:iam::543292785457:role/github-actions-terraform-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.stack }}
    steps:
      # All actions are pinned to commit SHAs, not tags: this job assumes a role with
      # AdministratorAccess, so a hijacked action tag would mean full account takeover.
      # Dependabot (.github/dependabot.yml) keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.0'

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        run: terraform init -input=false

      # Locking is on: unlike the plan role, this role can write the S3 lockfile.
      - name: apply
        run: terraform apply -input=false -auto-approve
