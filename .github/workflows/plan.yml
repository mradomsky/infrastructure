name: terraform plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  PLAN_ROLE_ARN: arn:aws:iam::543292785457:role/github-actions-terraform-plan

jobs:
  plan:
    runs-on: ubuntu-latest
    # Never run for a forked PR. A fork's PR runs this base-repo workflow with an OIDC
    # token whose sub is `repo:mradomsky/infrastructure:pull_request` — which the plan
    # role trusts — and `terraform plan` can execute attacker-controlled code (external
    # data sources / providers in the PR's .tf). Once this repo is public anyone can
    # fork, so this guard is what stops a pull-request-target-style credential theft.
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, shared, projects/radomskyi-com, projects/stagehopper, projects/spacetraders]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      # Pinned to commit SHAs (see apply.yml for rationale); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.0'

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate

      # -lock=false: the CI role is read-only and cannot write the S3 lockfile.
      - name: plan
        run: terraform plan -input=false -lock=false -no-color
